name: toko-zaina

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zaina}
      POSTGRES_USER: ${POSTGRES_USER:-zaina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zaina_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    environment:
      NODE_ENV: development
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-zaina}:${POSTGRES_PASSWORD:-zaina_local_password}@database:5432/${POSTGRES_DB:-zaina}
      SESSION_SECRET: ${SESSION_SECRET:-local-session-secret-change-before-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-toko}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ganti-kata-sandi-lokal}
      STORE_NAME: ${STORE_NAME:-Toko Zaina}
      STORE_TIMEZONE: ${STORE_TIMEZONE:-Asia/Jakarta}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q '^ok'"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
